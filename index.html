<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kurise - 世界线观测者 | 命运石之门</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #010101;
            --text-color: #eef2ff;
            --text-muted: #8ea4b3;
            --neon-green: #00ff9d;
            --cyan: #00e5ff;
            --neon-glow: rgba(0, 255, 157, 0.6);
            --glass-bg: rgba(8, 12, 18, 0.7);
            --glass-border: rgba(0, 255, 157, 0.35);
            --card-radius: 32px;
            --wave-bg-center: rgba(0,20,10,0.3);
            --wave-bg-edge: #000000;
            --header-bg: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,20,10,0.5) 100%);
            --gallery-card-bg: rgba(12, 18, 24, 0.75);
            --russet-glow: rgba(200, 70, 20, 0.6);
        }

        body.light-mode {
            --bg-color: #f0f4f8;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --neon-green: #0d9488;
            --cyan: #06b6d4;
            --neon-glow: rgba(13, 148, 136, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(13, 148, 136, 0.3);
            --wave-bg-center: rgba(13, 148, 136, 0.08);
            --wave-bg-edge: #f0f4f8;
            --header-bg: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(240,253,244,0.8) 100%);
            --gallery-card-bg: rgba(245, 250, 250, 0.9);
            --russet-glow: rgba(180, 80, 30, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; width: 100%; overflow: hidden; position: fixed;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: none;
            transition: background 0.5s ease, color 0.5s ease;
        }

        #amadeus-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at center, #0a0c0a 0%, #000000 100%);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            font-family: 'VT323', 'Courier New', monospace;
            overflow: hidden;
            opacity: 1;
            visibility: visible;
        }
        .crt-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(180, 60, 20, 0.06) 0px, rgba(180, 60, 20, 0.06) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 2;
            animation: scanlines 8s linear infinite;
        }
        .crt-noise {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjUiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMTUiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }
        .crt-glow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            box-shadow: inset 0 0 80px rgba(200, 70, 20, 0.25), 0 0 50px rgba(180, 60, 15, 0.15);
            pointer-events: none;
            z-index: 2;
        }
        .worldline-digit-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            padding: 0 5%;
            transform: scale(1);
            transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .worldline-number {
            font-family: 'VT323', 'Courier New', monospace;
            font-weight: 700;
            font-size: clamp(4rem, 20vw, 16rem);
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #c93a0e 0%, #9b3a0a 40%, #732a06 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px #b84500, 0 0 20px #7a2e00;
            white-space: nowrap;
            overflow-x: auto;
            transition: filter 0.08s linear, text-shadow 0.1s ease;
            filter: blur(8px);
            opacity: 0.7;
        }
        .digit-zoom-out {
            animation: zoomPulse 0.7s cubic-bezier(0.2, 1.2, 0.8, 1) forwards !important;
        }
        @keyframes zoomPulse {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); text-shadow: 0 0 15px #d95b0e; }
            40% { transform: scale(1.6); opacity: 0.9; filter: blur(6px); text-shadow: 0 0 45px #d95b0e; }
            100% { transform: scale(3.2); opacity: 0; filter: blur(18px); visibility: hidden; }
        }
        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 20px; }
        }
        .loader-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .main-outer {
            transform: scale(0);
            transform-origin: center center;
            transition: transform 0.8s cubic-bezier(0.2, 0.95, 0.3, 1.1);
            width: 100%;
            max-width: 1460px;
            height: 82vh;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }
        .main-outer.zoomed {
            transform: scale(1);
        }

        .global-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(220,80,30,0.45) 0%, rgba(255,200,100,0) 80%);
            pointer-events: none;
            z-index: 10001;
            opacity: 0;
            animation: flashBurst 0.5s ease-out forwards;
        }
        @keyframes flashBurst {
            0% { opacity: 0; }
            15% { opacity: 0.7; }
            100% { opacity: 0; visibility: hidden; }
        }

        .stage {
            position: relative; z-index: 10; display: flex; align-items: stretch;
            gap: 18px; width: 100%; height: 100%;
        }

        .main-outer.zoomed .links a,
        .main-outer.zoomed .links button {
            animation: fadeSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2) backwards;
        }
        .main-outer.zoomed .container {
            animation: fadeSlideUp 0.55s ease-out 0.08s backwards;
        }
        .main-outer.zoomed .gallery-sidebar {
            animation: fadeSlideUp 0.55s ease-out 0.18s backwards;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(6px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .links a, .links button {
            opacity: 0;
            transform: translateX(-20px);
        }
        .main-outer.zoomed .links a, .main-outer.zoomed .links button {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.3s, transform 0.3s, background 0.2s;
        }

        .links {
            display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
        }
        .links a, .links button {
            color: var(--text-color);
            text-decoration: none; font-size: 13.5px; font-family: 'VT323', monospace;
            letter-spacing: 2px; padding: 12px 0; width: 125px; text-align: center;
            border: 1px solid var(--glass-border); border-left: 3px solid var(--neon-green);
            border-radius: 4px; background: var(--glass-bg); backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); cursor: none;
            box-shadow: -4px 0 12px rgba(0,0,0,0.05); display: block; outline: none;
        }
        .links button {
            font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 1px;
            color: var(--neon-green);
        }
        .links a:hover, .links button:hover {
            background: var(--neon-green); color: #fff;
            transform: translateX(6px) scale(1.03);
            box-shadow: 0 0 20px var(--neon-glow), inset 0 0 4px #fff; border-color: #fff;
        }

        .container {
            flex: 1; height: 100%; background: var(--glass-bg);
            backdrop-filter: blur(12px); border-radius: var(--card-radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border) inset, 0 0 30px var(--neon-glow);
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--neon-glow), transparent);
            border-radius: calc(var(--card-radius) + 2px); z-index: -1; opacity: 0.5; pointer-events: none;
        }

        header {
            background: var(--header-bg); padding: 22px 30px 16px; text-align: center;
            flex-shrink: 0; border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(4px); position: relative;
            transition: background 0.5s ease;
        }
        header::after {
            content: ''; position: absolute; bottom: -1px; left: 15%; width: 70%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), var(--cyan), transparent); filter: blur(1px);
        }
        h1 {
            font-family: 'VT323', monospace; font-size: clamp(40px, 5vw, 65px);
            color: var(--neon-green); text-shadow: 0 0 12px var(--neon-glow);
            letter-spacing: 5px; font-weight: 400;
        }
        .subtitle {
            font-size: clamp(12px, 1.8vw, 17px); color: var(--text-color); margin-top: 8px;
            letter-spacing: 3px; font-weight: 600; text-transform: uppercase;
        }

        .hero {
            flex-shrink: 0; text-align: center; background: rgba(0, 0, 0, 0.1);
            padding: 12px 0 4px; position: relative;
        }
        body:not(.light-mode) .hero { background: rgba(0, 0, 0, 0.35); }
        
        .carousel-container {
            position: relative;
            width: 75%;
            max-width: 460px;
            margin: 0 auto;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .carousel-slides {
            position: relative;
            width: 100%;
            aspect-ratio: 800 / 300;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .carousel-slide.active {
            opacity: 1;
            pointer-events: auto;
        }
        .carousel-slide a {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            cursor: none;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px var(--neon-glow));
        }
        .carousel-slide a:hover img {
            transform: scale(1.02);
        }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            transition: all 0.2s;
            cursor: none;
            border: none;
            padding: 0;
        }
        .dot.active {
            width: 24px;
            background: var(--neon-green);
            box-shadow: 0 0 6px var(--neon-glow);
        }
        @media (max-width: 850px) {
            .carousel-container { width: 80%; max-width: 380px; }
        }
        @media (max-width: 550px) {
            .carousel-container { width: 85%; max-width: 320px; }
        }

        .content {
            flex: 1; padding: 24px 50px; max-width: 850px; margin: 0 auto; width: 100%;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar { width: 5px; }
        .content::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        .content::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        h2 {
            color: var(--neon-green); font-family: 'VT323', monospace; font-size: clamp(24px, 3vw, 32px);
            margin: 10px 0 14px 0; letter-spacing: 1.5px; border-left: 4px solid var(--neon-green);
            padding-left: 16px; text-shadow: 0 0 4px var(--neon-glow);
        }
        p {
            font-size: clamp(14px, 1.6vw, 16.5px); margin-bottom: 16px; line-height: 1.75;
            font-weight: 400; color: var(--text-color);
        }
        .highlight {
            color: var(--neon-green); font-weight: 700;
            background: linear-gradient(120deg, var(--neon-glow), transparent);
            padding: 0 4px; border-radius: 6px; text-shadow: 0 0 2px var(--neon-glow);
        }

        footer {
            flex-shrink: 0; text-align: center; padding: 14px; background: rgba(0, 0, 0, 0.2);
            color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(8px); letter-spacing: 0.5px;
        }
        body:not(.light-mode) footer { background: rgba(0, 0, 0, 0.5); }
        #last-updated { color: var(--neon-green); font-weight: 600; }

        .worldline {
            position: absolute; bottom: 20px; right: 28px; font-family: 'VT323', monospace;
            font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 30px;
            backdrop-filter: blur(4px); color: #d85a1a; letter-spacing: 1px; z-index: 15;
            pointer-events: none; border-left: 2px solid #c93a0e; text-shadow: 0 0 5px #b83e0a;
        }
        body.light-mode .worldline { background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); border-left: 2px solid #c93a0e; color:#b04510;}

        .gallery-sidebar {
            flex-shrink: 0;
            width: 400px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 28px rgba(0,0,0,0.2), 0 0 15px var(--neon-glow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s;
        }
        .gallery-header {
            padding: 12px 12px 0px 12px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding: 12px 16px;
            color: var(--text-muted);
            cursor: none;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
            font-weight: 600;
        }
        .tab-btn.active {
            color: var(--neon-green);
            border-bottom-color: var(--neon-green);
            text-shadow: 0 0 6px var(--neon-glow);
        }
        .tab-btn:hover {
            color: var(--neon-green);
            background: rgba(0,255,157,0.1);
        }
        .vertical-card-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .vertical-card-list::-webkit-scrollbar {
            width: 4px;
        }
        .vertical-card-list::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 8px;
        }
        .cert-card {
            background: var(--gallery-card-bg);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 157, 0.3);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0;
            min-height: 130px;
            opacity: 0;
            transform: translateY(15px);
        }
        .main-outer.zoomed .cert-card {
            animation: cardRise 0.4s ease-out forwards;
        }
        @keyframes cardRise {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cert-card:hover {
            transform: translateX(-5px) scale(1.02);
            border-color: var(--neon-green);
            box-shadow: 0 8px 20px var(--neon-glow), 0 0 0 1px var(--neon-green) inset;
        }
        .card-img {
            width: 105px;
            height: 90px;
            flex-shrink: 0;
            object-fit: contain;
            background: #0a0f14;
            padding: 4px;
        }
        body.light-mode .card-img {
            background: #eef2f5;
        }
        .card-textbox {
            flex: 1;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.65);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            word-break: break-word;
            white-space: normal;
            overflow-wrap: break-word;
        }
        body.light-mode .card-textbox {
            background: rgba(235, 245, 250, 0.9);
        }
        .card-rank {
            font-family: 'VT323', monospace;
            font-size: 0.75rem;
            color: var(--neon-green);
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .card-title {
            font-weight: 700;
            font-size: 0.8rem;
            line-height: 1.3;
            margin-bottom: 4px;
            color: var(--text-color);
        }
        .card-meta {
            font-size: 0.65rem;
            opacity: 0.8;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .card-full-desc {
            font-size: 0.65rem;
            opacity: 0.85;
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px dashed rgba(0,255,157,0.3);
            color: var(--cyan);
            line-height: 1.3;
        }
        .cert-card:hover .card-textbox {
            background: rgba(0, 20, 10, 0.9);
        }
        body.light-mode .cert-card:hover .card-textbox {
            background: rgba(200, 240, 230, 0.95);
        }

        @media (max-width: 1100px) {
            .gallery-sidebar { width: 360px; }
            .card-img { width: 95px; height: 80px; }
        }
        @media (max-width: 850px) {
            body { padding: 10px; }
            .main-outer { height: auto; max-height: none; }
            .stage { flex-direction: column; height: auto; max-height: none; gap: 14px; overflow-y: auto; }
            .links { flex-direction: row; justify-content: center; flex-wrap: wrap; width: 100%; margin-bottom: 4px; gap: 8px; }
            .links a, .links button { width: auto; font-size: 12px; padding: 6px 14px; border-left-width: 1px; border-bottom: 2px solid var(--neon-green); border-radius: 30px; }
            .container { height: auto; min-height: 440px; }
            .gallery-sidebar { width: 100%; height: auto; max-height: 400px; margin-top: 8px; }
            .vertical-card-list { flex-direction: row; overflow-x: auto; gap: 14px; padding: 12px; }
            .cert-card { min-width: 280px; flex-shrink: 0; }
            .card-img { width: 90px; height: 75px; }
        }
        a-waves { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; transition: background 0.5s ease; }
        a-waves.dark-bg { background: radial-gradient(circle at 20% 30%, rgba(0, 20, 10, 0.4) 0%, #000000 90%) !important; }
        a-waves.light-bg { background: radial-gradient(circle at 20% 30%, rgba(13, 148, 136, 0.12) 0%, #f0f4f8 90%) !important; }
        a-waves svg { width: 100%; height: 100%; filter: drop-shadow(0 0 3px var(--neon-glow)); }
        a-waves svg path { fill: none; stroke: url(#waveGradient); stroke-width: 1.5px; stroke-linecap: round; stroke-linejoin: round; opacity: 0.85; }
        .pointer { --width: 26px; --height: 26px; position: fixed; top: calc(var(--height) / -2); left: calc(var(--width) / -2); width: var(--width); height: var(--height); transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); pointer-events: none; z-index: 9999; filter: drop-shadow(0 0 5px var(--neon-green)); }
        .pointer div { position: absolute; width: 100%; height: 100%; border: 2px solid var(--neon-green); opacity: 0.95; box-shadow: 0 0 8px var(--neon-green); transition: all 0.2s; }
        .pointer div:nth-child(1) { border-top-style: solid; border-left-style: solid; top: -2px; left: -2px; }
        .pointer div:nth-child(2) { border-top-style: solid; border-right-style: solid; top: -2px; right: -2px; }
        .pointer div:nth-child(3) { border-bottom-style: solid; border-left-style: solid; bottom: -2px; left: -2px; }
        .pointer div:nth-child(4) { border-bottom-style: solid; border-right-style: solid; bottom: -2px; right: -2px; }
        .pointer::after { content: ''; position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; background: var(--neon-green); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px var(--neon-green); }
    </style>
</head>
<body>
<div id="amadeus-loader">
    <div class="crt-screen"></div>
    <div class="crt-noise"></div>
