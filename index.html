<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Kurise - About me</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0807;
            --text-color: #fff4f0;
            --text-muted: #b8a39f;
            
            --neon-red: #ff5e4a;
            --accent-warm: #ff7a66;
            --deep-red: #e03c2e;
            
            --neon-glow: rgba(255, 94, 74, 0.58);
            --neon-glow-warm: rgba(255, 122, 102, 0.45);
            
            --glass-bg: rgba(22, 12, 11, 0.78);
            --glass-border: rgba(255, 94, 74, 0.36);
            --glass-border-warm: rgba(255, 122, 102, 0.26);
            
            --card-radius: 32px;
            --header-bg: linear-gradient(135deg, rgba(15,8,7,0.92) 0%, rgba(35,12,10,0.8) 100%);
            --gallery-card-bg: rgba(24, 14, 13, 0.82);
        }

        body.light-mode {
            --bg-color: #fff8f5;
            --text-color: #2c1f1c;
            --text-muted: #8c6f68;
            
            --neon-red: #e03c2e;
            --accent-warm: #f45a48;
            --deep-red: #c12e22;
            
            --neon-glow: rgba(224, 60, 46, 0.32);
            --neon-glow-warm: rgba(244, 90, 72, 0.28);
            
            --glass-bg: rgba(255, 248, 245, 0.85);
            --glass-border: rgba(224, 60, 46, 0.32);
            --glass-border-warm: rgba(244, 90, 72, 0.25);
            
            --header-bg: linear-gradient(135deg, rgba(255,248,245,0.96) 0%, rgba(255,230,220,0.9) 100%);
            --gallery-card-bg: rgba(255, 248, 245, 0.95);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color) 0%, #0a0f14 50%, var(--bg-color) 100%);
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            cursor: none;
            transition: background 1.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.theme-switching {
            transition: background 2.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        #amadeus-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(ellipse at center, #0a0c0a 0%, #000000 100%);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s cubic-bezier(0.23, 1, 0.32, 1), visibility 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            font-family: 'VT323', 'Courier New', monospace;
            overflow: hidden;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .crt-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(180, 60, 20, 0.06) 0px, rgba(180, 60, 20, 0.06) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 2;
            animation: scanlines 8s linear infinite;
        }
        .crt-noise {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjUiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMTUiLz48L3N2Zz4=');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 2;
            mix-blend-mode: screen;
        }
        .crt-glow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            box-shadow: inset 0 0 80px rgba(200, 70, 20, 0.25), 0 0 50px rgba(180, 60, 15, 0.15);
            pointer-events: none;
            z-index: 2;
        }
        .worldline-digit-container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            padding: 0 5%;
            transform: scale(1);
            transition: transform 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .worldline-number {
            font-family: 'VT323', 'Courier New', monospace;
            font-weight: 700;
            font-size: clamp(4rem, 20vw, 16rem);
            letter-spacing: 0.06em;
            background: linear-gradient(135deg, #c93a0e 0%, #9b3a0a 40%, #732a06 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px #b84500, 0 0 20px #7a2e00;
            white-space: nowrap;
            overflow-x: auto;
            transition: filter 0.1s linear, text-shadow 0.1s ease;
            filter: blur(8px);
            opacity: 0.7;
        }
        .digit-zoom-out {
            animation: zoomPulse 0.7s cubic-bezier(0.2, 1.2, 0.8, 1) forwards !important;
        }
        @keyframes zoomPulse {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); text-shadow: 0 0 15px #d95b0e; }
            40% { transform: scale(1.6); opacity: 0.9; filter: blur(6px); text-shadow: 0 0 45px #d95b0e; }
            100% { transform: scale(3.2); opacity: 0; filter: blur(18px); visibility: hidden; }
        }
        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 20px; }
        }
        .loader-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .main-outer {
            transform: scale(0);
            transform-origin: center center;
            transition: transform 0.8s cubic-bezier(0.2, 0.95, 0.3, 1.1);
            width: 100%;
            max-width: 1460px;
            height: 82vh;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }
        .main-outer.zoomed {
            transform: scale(1);
        }
        .global-flash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(220,80,30,0.45) 0%, rgba(255,200,100,0) 80%);
            pointer-events: none;
            z-index: 10001;
            opacity: 0;
            animation: flashBurst 0.5s ease-out forwards;
        }
        @keyframes flashBurst {
            0% { opacity: 0; }
            15% { opacity: 0.7; }
            100% { opacity: 0; visibility: hidden; }
        }
        .stage {
            position: relative; z-index: 10; display: flex; align-items: stretch;
            gap: 18px; width: 100%; height: 100%;
        }
        .main-outer.zoomed .links a,
        .main-outer.zoomed .links button {
            animation: fadeSlideIn 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2) backwards;
        }
        .main-outer.zoomed .container {
            animation: fadeSlideUp 0.55s ease-out 0.08s backwards;
        }
        .main-outer.zoomed .gallery-sidebar {
            animation: fadeSlideUp 0.55s ease-out 0.18s backwards;
        }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(6px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .links a, .links button {
            opacity: 0;
            transform: translateX(-20px);
        }
        .main-outer.zoomed .links a, .main-outer.zoomed .links button {
            opacity: 1;
            transform: translateX(0);
            transition: opacity 0.3s, transform 0.3s, background 0.2s;
        }
        .links {
            display: flex; flex-direction: column; gap: 12px; flex-shrink: 0;
        }
        .links a, .links button {
            color: var(--text-color);
            text-decoration: none; 
            font-size: 13.5px; 
            font-family: 'VT323', monospace;
            letter-spacing: 2px; 
            padding: 11px 14px; 
            width: 148px; 
            text-align: left;
            border: 1px solid var(--glass-border); 
            border-left: 3px solid var(--neon-green);
            border-radius: 6px; 
            background: var(--glass-bg); 
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); 
            cursor: none;
            box-shadow: -4px 0 12px rgba(0,0,0,0.05); 
            display: flex;
            align-items: center;
            gap: 10px;
            outline: none;
        }
        .links button {
            font-family: 'Inter', sans-serif; 
            font-weight: 600; 
            letter-spacing: 1px;
            color: var(--neon-green);
        }
        .links a:hover, .links button:hover {
            background: var(--neon-green); 
            color: #fff;
            transform: translateX(8px) scale(1.03);
            box-shadow: 0 0 20px var(--neon-glow), inset 0 0 4px #fff; 
            border-color: #fff;
        }
        .links i {
            font-size: 14px;
            width: 16px;
        }
        .container {
            flex: 1; height: 100%; background: var(--glass-bg);
            backdrop-filter: blur(12px); border-radius: var(--card-radius);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2), 0 0 0 1px var(--glass-border) inset, 0 0 30px var(--neon-glow);
            overflow: hidden; display: flex; flex-direction: column; position: relative;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .container::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--neon-glow), transparent);
            border-radius: calc(var(--card-radius) + 2px); z-index: -1; opacity: 0.5; pointer-events: none;
        }
        header {
            background: var(--header-bg); padding: 22px 30px 16px; text-align: center;
            flex-shrink: 0; border-bottom: 1px solid var(--glass-border); backdrop-filter: blur(4px); position: relative;
            transition: background 0.5s ease;
        }
        header::after {
            content: ''; position: absolute; bottom: -1px; left: 15%; width: 70%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-green), var(--cyan), transparent); filter: blur(1px);
        }
        h1 {
            font-family: 'VT323', monospace; font-size: clamp(40px, 5vw, 65px);
            color: var(--neon-green); text-shadow: 0 0 12px var(--neon-glow);
            letter-spacing: 5px; font-weight: 400;
        }
        .subtitle {
            font-size: clamp(12px, 1.8vw, 17px); color: var(--text-color); margin-top: 8px;
            letter-spacing: 3px; font-weight: 600; text-transform: uppercase;
        }
        .hero {
            flex-shrink: 0; text-align: center; background: rgba(0, 0, 0, 0.1);
            padding: 12px 0 4px; position: relative;
        }
        body:not(.light-mode) .hero { background: rgba(0, 0, 0, 0.35); }
        .carousel-container {
            position: relative;
            width: 75%;
            max-width: 460px;
            margin: 0 auto;
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .carousel-slides {
            position: relative;
            width: 100%;
            aspect-ratio: 800 / 300;
        }
        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
        .carousel-slide.active {
            opacity: 1;
            pointer-events: auto;
        }
        .carousel-slide a {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            cursor: none;
        }
        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
            filter: drop-shadow(0 0 8px var(--neon-glow));
        }
        .carousel-slide a:hover img {
            transform: scale(1.02);
        }
        .carousel-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            transition: all 0.2s;
            cursor: none;
            border: none;
            padding: 0;
        }
        .dot.active {
            width: 24px;
            background: var(--neon-green);
            box-shadow: 0 0 6px var(--neon-glow);
        }
        .content {
            flex: 1; padding: 24px 50px; max-width: 850px; margin: 0 auto; width: 100%;
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }
        .content::-webkit-scrollbar { width: 5px; }
        .content::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        .content::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }
        h2 {
            color: var(--neon-green); font-family: 'VT323', monospace; font-size: clamp(24px, 3vw, 32px);
            margin: 10px 0 14px 0; letter-spacing: 1.5px; border-left: 4px solid var(--neon-green);
            padding-left: 16px; text-shadow: 0 0 4px var(--neon-glow);
        }
        p {
            font-size: clamp(14px, 1.6vw, 16.5px); margin-bottom: 16px; line-height: 1.75;
            font-weight: 400; color: var(--text-color);
        }
        .highlight {
            color: var(--neon-green); font-weight: 700;
            background: linear-gradient(120deg, var(--neon-glow), transparent);
            padding: 0 4px; border-radius: 6px; text-shadow: 0 0 2px var(--neon-glow);
        }
        footer {
            flex-shrink: 0; text-align: center; padding: 14px; background: rgba(0, 0, 0, 0.2);
            color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(8px); letter-spacing: 0.5px;
        }
        body:not(.light-mode) footer { background: rgba(0, 0, 0, 0.5); }
        #last-updated { color: var(--neon-green); font-weight: 600; }
        .worldline {
            position: absolute; bottom: 20px; right: 28px; font-family: 'VT323', monospace;
            font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 30px;
            backdrop-filter: blur(4px); color: #d85a1a; letter-spacing: 1px; z-index: 15;
            pointer-events: none; border-left: 2px solid #c93a0e; text-shadow: 0 0 5px #b83e0a;
        }
        body.light-mode .worldline { background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); border-left: 2px solid #c93a0e; color:#b04510;}
        .gallery-sidebar {
            flex-shrink: 0;
            width: 400px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 28px rgba(0,0,0,0.2), 0 0 15px var(--neon-glow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s;
        }
        .gallery-header {
            padding: 12px 12px 0px 12px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            letter-spacing: 1px;
            padding: 12px 16px;
            color: var(--text-muted);
            cursor: none;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            flex: 1;
            text-align: center;
            font-weight: 600;
        }
        .tab-btn.active {
            color: var(--neon-green);
            border-bottom-color: var(--neon-green);
            text-shadow: 0 0 6px var(--neon-glow);
        }
        .tab-btn:hover {
            color: var(--neon-green);
            background: rgba(0,255,157,0.1);
        }
        .vertical-card-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .vertical-card-list::-webkit-scrollbar {
            width: 4px;
        }
        .vertical-card-list::-webkit-scrollbar-thumb {
            background: var(--neon-green);
            border-radius: 8px;
        }
        .cert-card {
            background: var(--gallery-card-bg);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 157, 0.3);
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            cursor: pointer;
            overflow: hidden;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0;
            min-height: 130px;
            opacity: 0;
            transform: translateY(15px);
        }
        .main-outer.zoomed .cert-card {
            animation: cardRise 0.4s ease-out forwards;
        }
        @keyframes cardRise {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cert-card:hover {
            transform: translateX(-5px) scale(1.02);
            border-color: var(--neon-green);
            box-shadow: 0 8px 20px var(--neon-glow), 0 0 0 1px var(--neon-green) inset;
        }
        .card-img {
            width: 105px;
            height: 90px;
            flex-shrink: 0;
            object-fit: contain;
            background: #0a0f14;
            padding: 4px;
        }
        body.light-mode .card-img {
            background: #eef2f5;
        }
        .card-textbox {
            flex: 1;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.65);
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            word-break: break-word;
            white-space: normal;
            overflow-wrap: break-word;
        }
        body.light-mode .card-textbox {
            background: rgba(235, 245, 250, 0.9);
        }
        .card-rank {
            font-family: 'VT323', monospace;
            font-size: 0.75rem;
            color: var(--neon-green);
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }
        .card-title {
            font-weight: 700;
            font-size: 0.8rem;
            line-height: 1.3;
            margin-bottom: 4px;
            color: var(--text-color);
        }
        .card-meta {
            font-size: 0.65rem;
            opacity: 0.8;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }
        .card-full-desc {
            font-size: 0.65rem;
            opacity: 0.85;
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px dashed rgba(0,255,157,0.3);
            color: var(--cyan);
            line-height: 1.3;
        }
        .cert-card:hover .card-textbox {
            background: rgba(0, 20, 10, 0.9);
        }
        body.light-mode .cert-card:hover .card-textbox {
            background: rgba(200, 240, 230, 0.95);
        }
        @media (max-width: 1100px) {
            .gallery-sidebar { width: 360px; }
            .card-img { width: 95px; height: 80px; }
        }
        @media (max-width: 850px) {
            html, body {
                overflow: auto !important;
                position: static !important;
                height: auto !important;
                min-height: 100vh;
            }
            body {
                padding: 12px;
                cursor: auto;
                display: block;
                align-items: unset;
                justify-content: unset;
            }
            .main-outer {
                height: auto !important;
                max-height: none !important;
                transform: scale(1);
            }
            .stage {
                flex-direction: column;
                height: auto !important;
                overflow: visible;
                gap: 16px;
            }
            .links {
                flex-direction: row;
                justify-content: center;
                flex-wrap: wrap;
                width: 100%;
                margin-bottom: 4px;
                gap: 8px;
            }
            .links a, .links button {
                width: auto;
                min-width: 110px;
                font-size: 12px;
                padding: 8px 12px;
                border-left-width: 2px;
                border-bottom: 2px solid var(--neon-green);
                border-radius: 30px;
                justify-content: center;
            }
            .links i {
                display: none;
            }
            .container {
                height: auto !important;
                min-height: auto;
                overflow: visible;
            }
            .content {
                overflow-y: visible !important;
                max-height: none !important;
                padding: 16px 24px;
            }
            .gallery-sidebar {
                width: 100%;
                height: auto;
                max-height: none !important;
                margin-top: 8px;
            }
            .vertical-card-list {
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 14px;
                padding: 12px;
                flex: 0 0 auto;
                height: auto;
            }
            .cert-card {
                min-width: 280px;
                flex-shrink: 0;
            }
            .card-img {
                width: 90px;
                height: 75px;
            }
            .pointer {
                display: none;
            }
            .worldline {
                position: relative;
                bottom: auto;
                right: auto;
                display: inline-block;
                margin: 8px auto 12px auto;
                width: fit-content;
                background: var(--glass-bg);
                border: 1px solid var(--glass-border);
                border-left: 2px solid #c93a0e;
                text-align: center;
                font-size: 11px;
                backdrop-filter: blur(8px);
            }
            footer {
                margin-top: 0;
                padding: 12px;
                font-size: 11px;
            }
        }
        a-waves { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    class AWaves extends HTMLElement { 
        connectedCallback() { 
            this.svg = this.querySelector('svg'); 
            this.mouse = { x:0,y:0,lx:0,ly:0,sx:0,sy:0,v:0,vs:0,a:0 }; 
            this.lines = []; 
            this.paths = []; 
            this.bindEvents(); 
            this.setSize(); 
            this.setLines(); 
            requestAnimationFrame(this.tick.bind(this)); 
        } 
        bindEvents() { 
            window.addEventListener('resize',()=>{ this.setSize(); this.setLines(); }); 
            const upd = (x,y)=>{ 
                if(!this.bounding) return; 
                this.mouse.x = x - this.bounding.left; 
                this.mouse.y = y - this.bounding.top; 
            }; 
            window.addEventListener('mousemove',e=>upd(e.clientX,e.clientY)); 
            window.addEventListener('touchmove',e=>{ if(e.touches.length) upd(e.touches[0].clientX,e.touches[0].clientY); }); 
            window.addEventListener('touchstart',e=>{ if(e.touches.length) upd(e.touches[0].clientX,e.touches[0].clientY); }); 
        } 
        setSize() { 
            this.bounding = this.getBoundingClientRect(); 
            this.svg.style.width = `${this.bounding.width}px`; 
            this.svg.style.height = `${this.bounding.height}px`; 
        } 
        setLines() { 
            const {width,height}=this.bounding; 
            if(width===0||height===0) return; 
            this.lines = []; 
            this.paths.forEach(p=>p.remove()); 
            this.paths=[]; 
            const xGap=10,yGap=28,oWidth=width+200,oHeight=height+40; 
            const totalLines=Math.ceil(oWidth/xGap), totalPoints=Math.ceil(oHeight/yGap); 
            const xStart=(width-xGap*totalLines)/2, yStart=(height-yGap*totalPoints)/2; 
            for(let i=0;i<=totalLines;i++){ 
                const points=[]; 
                for(let j=0;j<=totalPoints;j++) points.push({ x:xStart+xGap*i, y:yStart+yGap*j, cursor:{x:0,y:0,vx:0,vy:0} }); 
                this.lines.push(points); 
                const path = document.createElementNS('http://www.w3.org/2000/svg','path'); 
                path.setAttribute('stroke','url(#waveGradient)'); 
                this.svg.appendChild(path); 
                this.paths.push(path); 
            } 
        } 
        movePoints() { 
            const {lines,mouse}=this; 
            if(!lines.length) return; 
            lines.forEach(points=>points.forEach(p=>{ 
                const dx=p.x-mouse.sx, dy=p.y-mouse.sy, d=Math.hypot(dx,dy), l=Math.max(160,mouse.vs); 
                if(d<l){ 
                    const f=1-d/l; 
                    p.cursor.vx+=Math.cos(mouse.a)*f*mouse.vs*0.072; 
                    p.cursor.vy+=Math.sin(mouse.a)*f*mouse.vs*0.072; 
                } 
                p.cursor.vx+=(0-p.cursor.x)*0.006; 
                p.cursor.vy+=(0-p.cursor.y)*0.006; 
                p.cursor.vx*=0.93; 
                p.cursor.vy*=0.93; 
                p.cursor.x+=p.cursor.vx*1.9; 
                p.cursor.y+=p.cursor.vy*1.9; 
                p.cursor.x=Math.min(90,Math.max(-90,p.cursor.x)); 
                p.cursor.y=Math.min(90,Math.max(-90,p.cursor.y)); 
            })); 
        } 
        moved(point, withCursorForce=true) { 
            return { 
                x:Math.round((point.x+(withCursorForce?point.cursor.x:0))*10)/10, 
                y:Math.round((point.y+(withCursorForce?point.cursor.y:0))*10)/10 
            }; 
        } 
        drawLines() { 
            const {lines,paths}=this; 
            if(!lines.length) return; 
            lines.forEach((points,lIndex)=>{ 
                if(!points.length) return; 
                let p1=this.moved(points[0],false), d=`M ${p1.x} ${p1.y}`; 
                points.forEach((p,idx)=>{ 
                    const isLast=idx===points.length-1; 
                    const cur=this.moved(p,!isLast); 
                    d+=`L ${cur.x} ${cur.y}`; 
                }); 
                if(paths[lIndex]) paths[lIndex].setAttribute('d',d); 
            }); 
        } 
        tick() { 
            if(this.bounding){ 
                this.mouse.sx+=(this.mouse.x-this.mouse.sx)*0.1; 
                this.mouse.sy+=(this.mouse.y-this.mouse.sy)*0.1; 
                const dx=this.mouse.x-this.mouse.lx, dy=this.mouse.y-this.mouse.ly, d=Math.hypot(dx,dy); 
                this.mouse.vs+=(d-this.mouse.vs)*0.1; 
                this.mouse.vs=Math.min(95,this.mouse.vs); 
                this.mouse.lx=this.mouse.x; 
                this.mouse.ly=this.mouse.y; 
                this.mouse.a=Math.atan2(dy,dx); 
                this.movePoints(); 
                this.drawLines(); 
            } 
            requestAnimationFrame(this.tick.bind(this)); 
        } 
    }
    
    if(!customElements.get('a-waves')) customElements.define('a-waves', AWaves);
    
    const pointer=document.querySelector(".pointer"); 
    let targetElem=null;
    if(window.innerWidth > 850) {
        document.addEventListener('mouseenter',(e)=>{ if(e.target.closest?.('._target')) targetElem=e.target.closest('._target'); },true);
        document.addEventListener('mouseleave',(e)=>{ if(e.target.closest?.('._target')&&targetElem===e.target.closest('._target')){ targetElem=null; pointer.style.setProperty("--width","26px"); pointer.style.setProperty("--height","26px"); } },true);
        window.addEventListener("mousemove",(e)=>{ 
            let x=e.clientX,y=e.clientY; 
            if(targetElem){ 
                const r=targetElem.getBoundingClientRect(); 
                const cx=r.left+r.width/2, cy=r.top+r.height/2; 
                x=cx+(x-cx)*0.12; 
                y=cy+(y-cy)*0.12; 
                pointer.style.setProperty("--width",`${Math.max(28,r.width*1.05)}px`); 
                pointer.style.setProperty("--height",`${Math.max(28,r.height*1.2)}px`); 
            } else { 
                pointer.style.setProperty("--width","26px"); 
                pointer.style.setProperty("--height","26px"); 
            } 
            pointer.style.transform=`translate3d(${x}px, ${y}px, 0)`; 
        });
    } else { 
        if(pointer) pointer.style.display = 'none'; 
    }
    
    const carouselItems=[{img:"images/topimage.jpg",link:"https://steinsgate.jp/"},{img:"images/kurisu.jpg",link:"https://www.pixiv.net/artworks/126362853"}];
    let currentSlide=0, autoInterval=null;
    const slidesContainer=document.getElementById('carouselSlides'), dotsContainer=document.getElementById('carouselDots');
    let totalSlides=carouselItems.length;
    
    function buildCarousel(){
        slidesContainer.innerHTML=''; 
        dotsContainer.innerHTML='';
        carouselItems.forEach((item,idx)=>{
            const slideDiv=document.createElement('div'); 
            slideDiv.className='carousel-slide'; 
            if(idx===0) slideDiv.classList.add('active');
            const link=document.createElement('a'); 
            link.href=item.link; 
            link.target='_blank'; 
            link.classList.add('_target');
            const img=document.createElement('img'); 
            img.src=item.img; 
            img.loading='eager'; 
            img.fetchPriority='high';
            img.onerror=function(){ 
                this.src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 300'%3E%3Crect width='800' height='300' fill='%23000'/%3E%3Ctext x='50%25' y='50%25' fill='%23c93a0e' font-family='monospace' font-size='26' text-anchor='middle' dy='.3em'%3EEL PSY KONGROO%3C/text%3E%3C/svg%3E"; 
                onPreloadImageComplete(); 
            };
            img.addEventListener('load', onPreloadImageComplete);
            img.addEventListener('error', onPreloadImageComplete);
            link.appendChild(img); 
            slideDiv.appendChild(link); 
            slidesContainer.appendChild(slideDiv);
            const dot=document.createElement('button'); 
            dot.classList.add('dot'); 
            if(idx===0) dot.classList.add('active');
            dot.addEventListener('click',()=>goToSlide(idx)); 
            dotsContainer.appendChild(dot);
        });
    }
    
    function updateCarousel(){ 
        document.querySelectorAll('.carousel-slide').forEach((s,i)=> i===currentSlide ? s.classList.add('active'):s.classList.remove('active')); 
        document.querySelectorAll('.dot').forEach((d,i)=> i===currentSlide ? d.classList.add('active'):d.classList.remove('active')); 
    }
    
    function goToSlide(idx){ 
        currentSlide=(idx+totalSlides)%totalSlides; 
        updateCarousel(); 
        resetAutoPlay(); 
    }
    
    function nextSlide(){ 
        goToSlide(currentSlide+1); 
    }
    
    function resetAutoPlay(){ 
        if(autoInterval) clearInterval(autoInterval); 
        autoInterval=setInterval(()=>nextSlide(),4500); 
    }
    
    function pauseAutoPlay(){ 
        if(autoInterval) clearInterval(autoInterval); 
    }
    
    function resumeAutoPlay(){ 
        resetAutoPlay(); 
    }
    
    function bindCarouselEvents(){ 
        const c=document.getElementById('carousel'); 
        if(c){ 
            c.addEventListener('mouseenter',pauseAutoPlay); 
            c.addEventListener('mouseleave',resumeAutoPlay); 
        } 
    }
    
    window.addEventListener('load', () => {
        const waves = document.querySelector('a-waves');
        if(waves && waves.setSize){ 
            waves.setSize(); 
            waves.setLines(); 
        }
        setWavesBackground(document.body.classList.contains('light-mode'));
        buildCarousel();
        bindCarouselEvents();
        resetAutoPlay();
        initTabs();
        renderContent('competition');
        updateTabButtonTexts();
        updateLastUpdated();
        
        setTimeout(() => { 
            if(!revealTriggered) {
                preloadCount = preloadTotal;
                isWindowLoaded = true;
                checkRevealCondition();
            }
        }, 6000);
        isWindowLoaded = true;
        checkRevealCondition();
    });
</script>
